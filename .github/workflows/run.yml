name: Flight Price Tracker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 21 * * *" # daily ~08:15 Sydney (AEDT/AEST varies with DST)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (if requirements.txt exists)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tracker
        env:
          ROUTE: "SYD-DXB"
          THRESHOLD_AUD: "1200"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          python tracker.py | tee output.txt

      - name: Detect alert
        id: detect_alert
        run: |
          if [ -f output.txt ] && grep -q "ALERT:" output.txt; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "ALERT detected"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
            echo "No alert"
          fi

      - name: Notification placeholder
        if: steps.detect_alert.outputs.alert == 'true'
        run: |
          echo "👉 Price drop detected — tracker printed ALERT:"
          grep -n "ALERT:" output.txt || true
