name: Flight Price Tracker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 21 * * *" # daily ~08:15 Sydney (AEDT/AEST varies with DST)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (if requirements.txt exists)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tracker
        env:
          ROUTE: "SYD-DXB"
          THRESHOLD_AUD: "1200"
        run: |
          python tracker.py | tee output.txt

      - name: Detect alert
        id: detect_alert
        run: |
          if [ -f output.txt ] && grep -q "ALERT:" output.txt; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email via Gmail (only if alert)
        if: steps.detect_alert.outputs.alert == 'true'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          user = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          to_email = os.environ["ALERT_TO_EMAIL"]

          body = "Flight price dropped below your threshold.\n\nCheck it now!"
          msg = MIMEText(body)
          msg["Subject"] = "✈️ Flight Price Alert"
          msg["From"] = user
          msg["To"] = to_email

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)

          print("Email sent")
          PY
