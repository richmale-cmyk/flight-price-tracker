    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracker
        env:
          ROUTE: "SYD-DXB"
          THRESHOLD_AUD: "1200"
        run: |
          python tracker.py | tee output.txt

      - name: Notify (Slack) on alert
        if: contains(steps.run.outputs, 'ALERT') == true
        run: echo "Wire Slack here"

