name: Flight Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * *"   # Runs daily (Sydney morning)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracker
        id: run_tracker
        env:
          ROUTE: "SYD-DXB"
          THRESHOLD_AUD: "1200"
        run: |
          python tracker.py | tee output.txt

      - name: Detect alert
        id: detect_alert
        run: |
          if grep -q "ALERT:" output.txt; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Email (only if alert)
        if: steps.detect_alert.outputs.alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Flight Price Drop Detected ✈️"
          body: "SYD–DXB price dropped below threshold. Go book it."
          to: your@email.com
          from: Flight Tracker
