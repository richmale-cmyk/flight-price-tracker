name: Flight Price Tracker

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron runs in UTC
    - cron: "15 21 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ROUTE: "SYD-DXB"
      THRESHOLD_AUD: "1200"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run tracker
        id: run_tracker
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          python tracker.py | tee output.txt

      - name: Detect alert
        id: detect_alert
        run: |
          if [ -f output.txt ] && grep -q "ALERT:" output.txt; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "subject=Flight Price Alert (${ROUTE})" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "ALERT found in tracker output:"
              echo ""
              grep -n "ALERT:" output.txt | head -20
              echo ""
              echo "Last 60 lines of output:"
              tail -60 output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email (Gmail SMTP)
        if: steps.detect_alert.outputs.alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: "smtp.gmail.com"
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.detect_alert.outputs.subject }}
          to: ${{ secrets.ALERT_TO_EMAIL }}
          from: "Flight Price Tracker <${{ secrets.SMTP_USERNAME }}>"
          body: ${{ steps.detect_alert.outputs.body }}
